body:
  text: 大興善寺三藏沙門不空奉詔譯如是我聞一時佛在舍衛國祇樹給孤獨園與大阿羅漢千二百五十人俱復有無量大菩薩衆彌勒菩薩曼殊室利菩薩觀世音菩薩而為上首及摩利支等諸天龍八部前後圍繞爾時舍利弗即從座起偏袒右肩右膝著地合掌向佛而白佛言世尊於未來世末世衆生作何等法得脫諸難佛告舍利弗諦聽諦聽我今為汝說於此事爾時會衆歡喜踊躍重勸請佛爾時世尊告諸比丘日前有天名摩利支有大神通自在之法常行日前日不見彼彼能見日無人能見無人能知無人能捉無人能害無人欺誑無人能縛無人能債其財物無人能罰不畏怨家能得其便佛告諸比丘若有人知彼摩利支天名者彼人亦不可見亦不可知亦不可捉亦不可害亦不為人欺誑亦不為人縛亦不為人債其財物亦不為人責罰亦不為怨家能得其便佛告諸比丘若善男子善女人知彼摩利支天名者應作是言我弟子某甲知彼摩利支天名故無人能見我無人能知我無人能捉我無人能害我無人能欺誑我無人能縛我無人能債我財物無人能責罰我亦不為怨家能得我便此呪有大神力所作成就破一切惡若用結界百由旬內一切諸惡無敢入者爾時世尊即說呪曰南無佛陀耶一南無達摩耶二南無僧伽耶三怛姪他四遏囉迦末斯五摩囉迦末斯六蘇途末斯七支鉢囉末斯八摩訶支鉢囉末斯九摩利支夜末斯十安怛陀那夜末斯十一那謨粹都底十二莎訶十三王難中護我賊難中護我行路中護我失於道路曠野中護我晝日護我夜中護我水難中護我火難中護我羅剎難中護我茶枳儞鬼難中護我毒藥難中護我佛實語護我法實語護我僧實語護我天實語護我仙人實語護我怛姪他一阿羅拘隸二阿囉拘隸三雞栗底知約反四薩婆迦囉醯蔽蔽亞反下同五薩蒲跛突瑟䶩二合蔽六薩婆伊都波達羅鞞蔽七囉上音叉囉上音叉自稱名字八莎呵九奉請摩利支天呪一名摩利支天身呪呪曰娜謨囉跢那二合跢囉二合夜耶一摩唎支唎馱去音耶二摩婆上帝移沙上彌三跢姪他四婆上囉去梨五婆馱梨六婆囉呵目溪七薩婆上徒瑟誓去二合八槃上馱槃上馱九娑婆呵十佛告諸比丘若有人識彼摩利支天菩薩者除一切障難王難賊難猛獸毒蟲之難水火等難若人欲行此法者一切法中此法最勝持此呪者面向百踰闍那一切鬼神惡人無能得其便者若於難中行時晨起誦前身呪呪一掬水四方散灑及灑自身若衣襟若衣袂若袈裟角一呪一結總作三結即往難中行連誦前二大呪而行所有一切事難軍防主者悉皆迷醉都無覺知之者佛說是經已告諸比丘比丘尼優婆塞優婆夷國王大臣及諸人民等聞佛說是摩利支天陀羅尼一心受持之者是人不為一切諸惡所害諸比丘若有人能書寫讀誦受持之者若著髻中若著衣中隨身而行一切諸惡悉皆退散無敢當者是諸四衆天龍八部禮佛而退歡喜奉行
